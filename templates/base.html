<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} - {{ error_name }} | fail-but-pretty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    {% if inline_css %}<style>{{ inline_css | safe }}</style>{% else %}<link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">{% endif %}
    {% block head %}{% endblock %}
</head>
<body>
    {% block background %}{% endblock %}
    {% block content %}{% endblock %}

    <!-- Go Back Button - Fixed Position -->
    <a href="{{ previous_url }}" class="go-back-btn" id="goBackBtn" aria-label="Go back to previous page">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        <span>Go Back</span>
    </a>

    <!-- Error Code Badge -->
    <div class="error-badge" aria-label="Error {{ error_code }}: {{ error_name }}">
        <span class="error-code">{{ error_code }}</span>
        <span class="error-name">{{ error_name }}</span>
    </div>

    {% block scripts %}{% endblock %}
    {% if inline_js %}<script>{{ inline_js | safe }}</script>{% else %}<script src="{{ url_for('static', path='js/main.js') }}"></script>{% endif %}
    {% block extra_scripts %}{% endblock %}
</body>
</html>
